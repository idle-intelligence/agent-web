[workspace]
members = [
    "crates/agent",
    "crates/agent-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tokenizers = { version = "0.22", default-features = false }
clap = { version = "4.5", features = ["derive", "env"] }
pollster = "0.3"

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"

# lean's engine (text in, text out) and its chat layer (messages and tools
# to prompt text with the model's own template), pinned to one commit of
# llm-web so a clean clone always resolves the same API. No default
# features: the agent crate turns on `threads` natively and agent-wasm
# turns on `web`.
lean = { git = "https://github.com/idle-intelligence/llm-web", rev = "6daf322d8759f570b7bd01363bbe0c7ab6cc21b3", default-features = false }
lean-chat = { git = "https://github.com/idle-intelligence/llm-web", rev = "6daf322d8759f570b7bd01363bbe0c7ab6cc21b3" }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.release-wasm]
inherits = "release"
opt-level = "s"
