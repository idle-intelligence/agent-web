name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (live-model and GPU tests skip cleanly without a model file or wgpu adapter)
        run: cargo test --workspace --release

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Clippy agent-wasm for wasm32
        run: cargo clippy -p agent-wasm --target wasm32-unknown-unknown --all-targets -- -D warnings

      - name: Build agent-wasm for wasm32
        run: wasm-pack build crates/agent-wasm --target web --release
